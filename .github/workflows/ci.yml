name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test -race -cover ./...
      - name: Build
        run: go build ./cmd/gateway
